# Nginx раздаёт только готовую сборку. Токены и переписка сюда не отправляются.
server {
    listen 80;
    listen [::]:80;
    server_name max-api.komaroff-dev.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name max-api.komaroff-dev.ru;

    ssl_certificate /etc/letsencrypt/live/max-api.komaroff-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-api.komaroff-dev.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/portfolio/max-api/current;
    index index.html;

    # Клиент обращается напрямую к GREEN-API. Остальные внешние подключения запрещены.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.api.green-api.com; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    # Имена assets содержат хеш. Старый HTML при этом не должен оставаться в кеше.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /release.json {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
