# Первый запуск: этот host нужен только для проверки домена Let's Encrypt.
# Само приложение появится после сборки и переключения current.
server {
    listen 80;
    listen [::]:80;
    server_name max-api.komaroff-dev.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
